version: '3.8'

services:

  app:
    build: .
    container_name: projectpulse_app
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8
    container_name: projectpulse_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: projectpulse
      MYSQL_USER: pulseuser
      MYSQL_PASSWORD: pulsepass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
